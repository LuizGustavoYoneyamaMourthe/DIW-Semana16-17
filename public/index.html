<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesão MTG Premodern Casual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>MESÃO - Seu MTG Premodern Casual</h1>
    </header>

    <section class="carousel-section">
        <div id="carouselDecks" class="carousel slide" data-bs-ride="false">
            <div class="carousel-inner" id="carousel-inner">
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselDecks" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselDecks" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>

    <section class="decks-section">
        <h2>Todos os Decks</h2>
        <div class="decks-grid" id="cards-container"></div>
    </section>

    <section class="crud-section">
        <div class="crud-container">
            <div class="crud-header">
                <h2>Adicione seu deck</h2>
                <p>Crie, edite, encontre e remova decks em um só lugar.</p>
            </div>

            <form id="deck-form" class="deck-form">
                <input type="hidden" id="deck-id">

                <div class="form-group">
                    <label for="deck-title">Título</label>
                    <input type="text" id="deck-title" name="titulo" placeholder="Ex.: Mono Red Burn" required>
                </div>

                <div class="form-group">
                    <label for="deck-description">Descrição</label>
                    <input type="text" id="deck-description" name="descricao" placeholder="Ex.: Deck agressivo e direto" required>
                </div>

                <div class="form-group">
                    <label for="deck-content">Conteúdo</label>
                    <textarea id="deck-content" name="conteudo" rows="4" placeholder="Descreva como este deck funciona..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar deck</button>
                    <button type="button" id="cancel-edit" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>

            <div class="crud-search">
                <input type="text" id="search-name" placeholder="Procure um deck pelo nome">
                <button type="button" id="search-button" class="btn btn-primary">Buscar</button>
                <button type="button" id="show-all-button" class="btn btn-secondary">Mostrar todos</button>
            </div>

            <div id="crud-status" class="crud-status" aria-live="polite"></div>

            <div class="crud-list-wrapper">
                <h3>Decks cadastrados</h3>
                <ul id="crud-list" class="crud-list"></ul>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-logo-info">
                <img src="assets/img/LG.png" alt="LG Logo" class="footer-logo">
                <div class="footer-info">
                    <p><strong>Aluno:</strong> Luiz Gustavo Yoneyama Mourthe</p>
                    <p><strong>Curso:</strong> Ciências da Computação 2P</p>
                    <p><strong>Turma:</strong> Manhã</p>
                </div>
            </div>
            <nav class="footer-nav">
                <a href="#">Home</a>
                <a href="#">Premodern</a>
                <a href="https://www.linkedin.com/in/luiz-gustavo-yoneyama-mourth%C3%A9-b4766a29a/">Linkedin</a>
                <a href="https://www.instagram.com/gustavomourthe/">Instagram</a>
                <a href="https://www.facebook.com/luizgustavo.yoneyamamourthe">Facebook</a>
                <a href="https://x.com/LGYMourthe">Twitter</a>
            </nav>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
